name: Monitor city complaints

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-negative
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore bounded technical state
        uses: actions/cache@v4
        with:
          path: data
          key: sko-negative-state-${{ github.run_id }}
          restore-keys: |
            sko-negative-state-

      - name: Cache local semantic and speech models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: sko-local-models-${{ runner.os }}-v1

      - name: Install OCR and free analyzers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-rus tesseract-ocr-kaz
          pip install '.[semantic,media]'

      # Сессия Instagram сюда больше не передаётся. Instagram отвечает 429 на
      # любой адрес дата-центра, поэтому собрать отсюда всё равно нечего, а
      # показывать сохранённый вход с чужого адреса — риск для аккаунта.
      # Городские паблики собирает Mac: launchd/kz.sko.monitor.instagram.plist.
      - name: Prepare data directory
        run: mkdir -p data

      - name: Run complaint monitoring
        env:
          APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          MONITOR_WEBHOOK_SECRET: ${{ secrets.MONITOR_WEBHOOK_SECRET }}
          INSTAGRAM_ENABLED: "false"
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v22.0' }}
          ENABLE_SEMANTIC: "true"
          ENABLE_DELIVERY: "true"
          ENABLE_MEDIA_ANALYSIS: "true"
          ENABLE_VIDEO_ANALYSIS: "false"
          SOURCE_REGISTRY: config/sources.json
          STATE_DB: data/negative.sqlite3
          EXPORT_DIR: exports
        run: sko-monitor run --mode negative --lookback-hours 72

      - name: Keep only the latest export for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-negative-results
          path: exports/latest.*
          if-no-files-found: ignore
          retention-days: 1
