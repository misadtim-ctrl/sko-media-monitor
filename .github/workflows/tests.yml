name: Test monitoring code

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: pip install -e '.[dev,instagram]'

      - name: Test Python and source registry
        run: |
          python -m pytest
          ruff check src tests/python tools
          python tests/source_registry_test.py

      - name: Test Apps Script
        run: |
          cat apps-script/SourceRegistry.gs apps-script/Code.gs | node --check --input-type=commonjs
          node --test tests/apps_script_core.test.mjs

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |file| YAML.load_file(file) }'
